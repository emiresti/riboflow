[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riboflow"
version = "2.0.0"
description = "Biophysical ribosome traffic (l-TASEP), 5' mRNA folding thermodynamics, exit-tunnel drag, synonymous mutation lab & mRNA vaccine / SynBio codon designer."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Muhammed Emir Esti", email = "muhammedemiresti3@gmail.com"}
]
requires-python = ">=3.10"
keywords = [
    "bioinformatics",
    "molecular-biology",
    "ribosome-profiling",
    "tasep",
    "codon-harmonization",
    "synonymous-mutations",
    "translation-kinetics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
riboflow = "riboflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riboflow = ["web/static/*"]
